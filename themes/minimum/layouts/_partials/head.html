<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ printf "%s – %s" site.Title .Title }}{{ else }}{{ if isset .Params "head_title" }}{{ printf "%s – %s" .Params.head_title site.Title }}{{ else }}{{ printf "%s – %s" .Title site.Title }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ .Description }}">
  <meta name="author" content="Jacopo Donati">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ partialCached "head/og.html" . }}
  {{ partialCached "head/favicon.html" . }}
  {{ partialCached "head/css.html" . }}
  {{ partialCached "head/js.html" . }}
  {{ partialCached "head/json-ld.html" . -}}
