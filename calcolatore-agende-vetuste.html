<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calcolatore di agende vetuste</title>
	<meta name="description" content="Come trovare agendine d'epoca.">
	<meta name="keywords" content="Jacopo Donati, sito personale, agende, passato, anni">
	<meta name="author" content="Jacopo Donati">
	<link rel="icon" href="/favicon.ico" sizes="48x48">
	<link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
	<link rel="stylesheet" href="/css/agende.css">
	<script src="/js/agende.js"></script>
</head>

<body id="agende">
	<main>
		<div class="window" style="width: 300px">
			<div class="title-bar">
				<div class="title-bar-text">Calcolatore di agende vetuste</div>
			</div>
			<div class="window-body">
				<div id="input">
					<fieldset>
						<legend>Dati di partenza</legend>
						<div class="field-row-stacked">
							<label for="anno">Anno da imitare:</label>
							<input type="number" name="anno" id="anno">
						</div>
						<div class="field-row-stacked">
							<label for="soglia">Inizio ricerca:</label>
							<input type="number" name="soglia" id="soglia" value="1900">
						</div>
					</fieldset>
					<div id="right">
						<input type="submit" name="trova" id="trova" value="Calcola">
					</div>
				</div>
				<div id="output">
				</div>
			</div>
		</div>




	</main>
</body>

</html>
